<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma de estudos de Projeto Orientado a Objetos: UML, diagramas de sequência, modelagem de dados, testes e resumo.">

<title>Projeto Orientado a Objetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir aulas" data-i18n-attr="aria-label:openLessonsAria">☰</button>

    <a class="logo" id="logoHome" href="#inicio" aria-label="Projeto Orientado a Objetos: ir para o Início" data-i18n-attr="aria-label:logoAria"><div class="logo-mark" aria-hidden="true"><svg viewBox="70 170 600 450" fill="currentColor"><mask id="argoMask" maskUnits="userSpaceOnUse" x="70" y="170" width="600" height="450"><rect x="70" y="170" width="600" height="450" fill="#fff"/><g fill="none" stroke="#000" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M330 425Q440 490 520 505Q610 490 642 385"/><path d="M465 300L575 468"/></g></mask><path mask="url(#argoMask)" stroke="currentColor" stroke-width="8" stroke-linejoin="round" d="M90 285L330 420L430 240L465 300L650 185L640 540Q430 610 230 595Z"/></svg></div><div data-i18n="docTitle">Projeto Orientado a Objetos</div></a>
    <div class="top-prog"><span class="lbl" id="progTxt">0 de 0 aulas</span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
    <div class="lang" id="lang">
      <button class="icon-btn lang-btn" id="langBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Idioma" data-i18n-attr="aria-label:langAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.8 5.7 3.8 9S14.5 18.3 12 21c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg></button>
      <div class="lang-menu" id="langMenu" role="menu">
        <button role="menuitemradio" data-l="pt" aria-checked="true"><span>Português (BR)</span><i aria-hidden="true">✓</i></button>
        <button role="menuitemradio" data-l="en" aria-checked="false"><span>English</span><i aria-hidden="true">✓</i></button>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema" data-i18n-attr="aria-label:themeAria">◐</button>

  <nav class="side" id="side" aria-label="Aulas" data-i18n-attr="aria-label:sideNavAria"></nav>

  <main class="lesson" id="lesson"><div class="lesson-in" id="lessonIn"></div></main>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="js/i18n.js"></script>
<script src="js/conteudo.js"></script>
<script src="js/provas.js"></script>

<script>
/* modo English: sobrepõe os dados em português (js/en/*) antes de iniciar o app */
if (LANG === "en") ["conteudo", "visualizacoes", "resumo", "provas", "ava"].forEach(function (n) { document.write("<script src=\"js/en/" + n + ".js\"><\/script>"); });
applyStatic();
</script>
<script src="js/app.js"></script>
